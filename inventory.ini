[webservers]
web-server-1 ansible_host=127.0.0.1 ansible_port=2201
web-server-2 ansible_host=127.0.0.1 ansible_port=2202

[dbservers]
db-server-1 ansible_host=127.0.0.1 ansible_port=2203

[production:children]
webservers
dbservers

[all:vars]
ansible_user=root
ansible_password=root
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_devops_lab4'
